<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif;-webkit-tap-highlight-color:transparent}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Duelo de Bolso</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@500;700;800&display=swap">
<style>
/* Layout: mesa de jogo de feltro; tabuleiro à esquerda, painel de ações à direita, mão embaixo. Tema único (mesa escura) por escolha. */
:root{
  --felt:#173a37; --felt-2:#1e4743; --rail:#0f2826; --ink:#eaf2ee; --ink-dim:#a9c2bb;
  --paper:#f2f4ee; --paper-ink:#1d2624; --gold:#f2c14e; --hi:#7fe3c9; --danger:#ff7a6b;
  --display:"Lilita One","Arial Black",system-ui,sans-serif;
  --body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--felt);color:var(--ink);font-family:var(--body);font-size:14px;
  background-image:radial-gradient(circle at 50% 40%,var(--felt-2),var(--felt) 70%);min-height:100vh}
#app{max-width:1180px;margin:0 auto;padding-block:16px 32px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font-family:var(--body);font-weight:800;cursor:pointer;border:0;border-radius:10px;padding:10px 14px;
  background:var(--gold);color:#2a1f05;font-size:14px}
button:disabled{opacity:.4;cursor:not-allowed}
button.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px rgba(234,242,238,.3)}
button:focus-visible,[data-a]:focus-visible{outline:3px solid var(--hi);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:400;letter-spacing:.5px;margin:0;text-wrap:balance}

/* MENU */
.menu{display:grid;gap:22px;max-width:860px;margin:0 auto}
.logo{font-size:clamp(40px,8vw,72px);line-height:.95;color:var(--gold);text-shadow:0 4px 0 #8a5d10}
.lede{color:var(--ink-dim);max-width:60ch;margin:6px 0 0;font-size:15px}
.label{font-size:12px;text-transform:uppercase;letter-spacing:1.5px;color:var(--ink-dim);font-weight:800;margin-bottom:10px}
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.opt{background:rgba(0,0,0,.18);border-radius:14px;padding:10px;text-align:center;cursor:pointer;
  box-shadow:inset 0 0 0 2px rgba(234,242,238,.12);color:var(--ink);display:grid;gap:4px;justify-items:center}
.opt svg{width:76px;height:68px}
.opt.on{box-shadow:inset 0 0 0 3px var(--gold);background:rgba(242,193,78,.1)}
.opt .nm{font-family:var(--display);font-size:17px}
.opt small{color:var(--ink-dim)}
.rivals{display:grid;gap:8px}
.rival{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;background:rgba(0,0,0,.18);
  cursor:pointer;box-shadow:inset 0 0 0 2px rgba(234,242,238,.1);color:var(--ink);text-align:left;width:100%;font-weight:700}
.rival.on{box-shadow:inset 0 0 0 3px var(--gold)}
.rival[disabled]{opacity:.45}
.rival .dot{width:14px;height:14px;border-radius:50%;flex:none}
.rival .st{margin-left:auto;font-size:12px;color:var(--ink-dim)}
details.rules{background:rgba(0,0,0,.18);border-radius:12px;padding:12px 14px}
details.rules summary{cursor:pointer;font-weight:800}
details.rules ul{margin:10px 0 0;padding-left:18px;display:grid;gap:6px;color:var(--ink-dim);max-width:70ch}
details.rules b{color:var(--ink)}

/* JOGO */
.game{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
@media (max-width:820px){.game{grid-template-columns:minmax(0,1fr)}}
.stage3d{perspective:1300px;perspective-origin:50% 0%}
.board{display:grid;gap:10px;border-radius:18px;padding:14px 12px 18px;
  background:linear-gradient(180deg,rgba(0,0,0,.24),rgba(0,0,0,.08));
  box-shadow:inset 0 0 0 2px rgba(0,0,0,.25),inset 0 18px 30px rgba(0,0,0,.25),0 22px 0 -6px var(--rail),0 34px 40px rgba(0,0,0,.45);
  transform:rotateX(16deg);transform-origin:50% 100%;transform-style:preserve-3d}
@media (max-width:480px){.board{transform:rotateX(9deg)}}
@media (prefers-reduced-motion:reduce){.board{transform:none}}
.side{display:grid;gap:8px}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;font-size:13px;color:var(--ink-dim)}
.meta .who{font-family:var(--display);font-size:18px;color:var(--ink)}
.pts{display:inline-flex;gap:4px;vertical-align:middle}
.pts i{width:12px;height:12px;border-radius:50%;box-shadow:inset 0 0 0 2px var(--gold)}
.pts i.f{background:var(--gold)}
.lane{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
.opp .lane{align-items:flex-start}
.bench{display:flex;gap:8px}
.slot{border-radius:12px;box-shadow:inset 0 0 0 2px rgba(234,242,238,.12),inset 0 6px 14px rgba(0,0,0,.35);background:rgba(0,0,0,.12);display:grid;place-items:center;color:rgba(234,242,238,.3);font-size:11px;text-transform:uppercase;letter-spacing:1px}
.slot.big{width:140px;height:212px}
.slot.sm{width:96px;height:150px}
.mid{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 2px;border-block:2px dashed rgba(234,242,238,.12)}
.turnflag{font-family:var(--display);font-size:16px}
.turnflag.me{color:var(--gold)}
@media (max-width:480px){
  .slot.big,.mon.big{width:122px!important;height:196px!important}
  .slot.sm,.mon.sm{width:80px!important;height:136px!important}
  .bench{gap:6px}.lane{gap:6px}
}

/* cartas */
.card,.mon{background:var(--paper);color:var(--paper-ink);border-radius:12px;position:relative;overflow:hidden;
  display:flex;flex-direction:column;text-align:left;padding:0;font-weight:700;
  box-shadow:0 1px 0 #d3d7cd,0 2px 0 #c1c5bb,0 3px 0 #adb2a7,0 4px 0 #989d92,0 12px 18px rgba(0,0,0,.45);
  transition:transform .22s ease,box-shadow .22s ease}
.card::after,.mon::after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;
  background:linear-gradient(135deg,rgba(255,255,255,.35),rgba(255,255,255,0) 40%,rgba(0,0,0,0) 70%,rgba(0,0,0,.12))}
.mon:hover{transform:translateY(-5px) translateZ(18px)}
.mon.sel{transform:translateY(-8px) translateZ(28px);box-shadow:0 1px 0 #d3d7cd,0 2px 0 #c1c5bb,0 3px 0 #adb2a7,0 4px 0 #989d92,0 22px 26px rgba(0,0,0,.5)}
.lunge-up{animation:lungeUp .55s ease}
.lunge-down{animation:lungeDown .55s ease}
@keyframes lungeUp{40%{transform:translateY(-34px) translateZ(40px) scale(1.06)}}
@keyframes lungeDown{40%{transform:translateY(34px) translateZ(40px) scale(1.06)}}
@media (prefers-reduced-motion:reduce){.lunge-up,.lunge-down,.hit{animation:none}.mon:hover,.mon.sel{transform:none}}
.mon.big{width:140px;height:212px}
.mon.sm{width:96px;height:150px}
.hd{display:flex;justify-content:space-between;align-items:baseline;gap:4px;padding:4px 7px;color:#fff;background:var(--tc)}
.hd .n{font-family:var(--display);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.sm .hd .n{font-size:12px}
.hd .hp{font-size:11px;white-space:nowrap}
.pic{flex:1;display:grid;place-items:center;background:var(--tb);min-height:0}
.pic svg{width:100%;height:100%;max-height:96px}
.bar{height:6px;background:#d6dbd3;margin:4px 7px 0;border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:#3fae5b}
.bar i.mid{background:#e3a72a}.bar i.low{background:#d9493a}
.ft{display:flex;align-items:center;justify-content:space-between;gap:4px;padding:3px 7px 5px;font-size:9px;color:#56625e;min-height:18px;border-top:1px dashed #cdd3c9;margin-top:3px}
.pips{display:flex;flex-wrap:wrap;gap:2px}
.pip{width:12px;height:12px;border-radius:50%;background:var(--tc);display:inline-grid;place-items:center;color:#fff;font-size:8px;font-weight:800;box-shadow:inset 0 0 0 1.5px rgba(0,0,0,.18)}
.pip.any{background:#bfc5bd;color:#4a5450}
.pip.miss{background:transparent;color:var(--tc);box-shadow:inset 0 0 0 1.5px var(--tc)}
.pip.any.miss{background:transparent;color:#7d867f;box-shadow:inset 0 0 0 1.5px #9aa39b}
.costs{display:grid;gap:2px;padding:3px 6px 0}
.cost{display:flex;align-items:center;gap:4px;font-size:10px;color:#34403c;line-height:1.1;min-width:0}
.cost .pips{flex:none;flex-wrap:nowrap}
.cost .an{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cost .dmg{margin-left:auto;font-family:var(--display);font-size:13px;font-weight:400;color:#1d2624}
.cost.ok .dmg{color:#17864a}
.cost.ok .an{color:#17864a}
.sm .cost .an,.acard .cost .an{display:none}
.sm .cost{gap:3px}.sm .cost .dmg{font-size:11px}
.sm .pip,.acard .pip{width:10px;height:10px;font-size:7px}
.card,.mon,.acard{border:3px solid var(--tc)}
.pic{background:radial-gradient(circle at 50% 40%,#fff 0,var(--tb) 70%)}
.stg{font-size:9px;text-transform:uppercase;letter-spacing:.8px;position:absolute;top:28px;left:6px;background:rgba(255,255,255,.8);padding:1px 5px;border-radius:6px;color:#34403c}
.sm .stg{top:24px}
.mon.sel,.card.sel{outline:3px solid var(--gold);outline-offset:2px}
.mon.tgt{outline:3px dashed var(--hi);outline-offset:3px;animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{outline-offset:6px}}
@media (prefers-reduced-motion:reduce){.mon.tgt{animation:none}}
.hit{animation:hit .45s}
@keyframes hit{25%{transform:translateX(-5px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}

/* mão */
.handwrap{margin-top:14px}
.hand{display:flex;gap:2px;overflow-x:auto;padding:26px 10px 14px;perspective:900px}
.card{width:112px;height:178px;flex:none;cursor:pointer;transform:translateY(var(--y,0)) rotate(var(--r,0deg));transform-origin:50% 120%}
.card:hover,.card.sel{transform:translateY(-18px) rotateX(8deg) scale(1.06);z-index:2}
@media (prefers-reduced-motion:reduce){.card,.card:hover,.card.sel{transform:none}}
.card .hd .n{font-size:13px}
.card .kind{font-size:10px;padding:4px 7px 6px;color:#45514d;line-height:1.25}
.card.energy .pic,.card.item .pic{background:var(--tb)}
.big-e{width:56px;height:56px;border-radius:50%;background:var(--tc);display:grid;place-items:center;color:#fff;font-family:var(--display);font-size:24px;box-shadow:inset 0 -4px 0 rgba(0,0,0,.18)}
.card.dim{opacity:.55}

/* painel */
.panel{background:var(--rail);border-radius:18px;padding:14px;display:grid;gap:12px;position:sticky;top:max(12px,env(safe-area-inset-top,0px))}
@media (max-width:820px){.panel{position:static}}
.panel h3{font-size:20px}
.panel p{margin:0;color:var(--ink-dim);line-height:1.45}
.atk{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:8px;background:rgba(255,255,255,.05);border-radius:10px;padding:8px}
.atk .an{font-weight:800}
.atk .ad{font-family:var(--display);font-size:18px;color:var(--gold)}
.atk .tx{grid-column:1/-1;font-size:12px;color:var(--ink-dim)}
.atk .pip{width:16px;height:16px;font-size:9px}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.chk{display:grid;gap:4px;font-size:13px;color:var(--ink-dim)}
.chk span.ok{color:var(--hi)}
.log{display:grid;gap:4px;font-size:12.5px;color:var(--ink-dim);max-height:180px;overflow:auto}
.log div:first-child{color:var(--ink)}
.tag{display:inline-block;font-size:11px;padding:2px 7px;border-radius:8px;background:var(--tc);color:#fff;font-weight:800}

/* fim */
.over{position:fixed;inset:0;background:rgba(8,20,19,.78);display:grid;place-items:center;z-index:20;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.over .box{background:var(--rail);border-radius:20px;padding:26px;max-width:420px;width:100%;display:grid;gap:14px;text-align:center;box-shadow:0 0 0 3px var(--gold)}
.over h2{font-size:42px;color:var(--gold)}
.over .btns{justify-content:center}
.over .box{max-height:92vh;overflow:auto}
.drops{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.drops .acard{width:96px}
.drops .new{position:absolute;top:4px;right:4px;background:var(--gold);color:#2a1f05;font-size:9px;padding:1px 5px;border-radius:6px;z-index:2}

/* abas */
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tabs button{background:rgba(0,0,0,.2);color:var(--ink)}
.tabs button.on{background:var(--gold);color:#2a1f05}
.stats{display:flex;flex-wrap:wrap;gap:6px 18px;color:var(--ink-dim);font-size:13px}
.stats b{color:var(--ink);font-family:var(--display);font-weight:400;font-size:18px}

/* álbum */
.album{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:12px}
.acard{background:var(--paper);color:var(--paper-ink);border-radius:10px;overflow:hidden;position:relative;display:flex;flex-direction:column;
  box-shadow:0 1px 0 #d3d7cd,0 2px 0 #c1c5bb,0 3px 0 #adb2a7,0 8px 12px rgba(0,0,0,.35)}
.acard .hd{padding:3px 6px}
.acard .hd .n{font-size:12px}
.acard .pic{height:70px;flex:none}
.acard .pic svg{max-height:78px}
.acard .meta2{display:flex;justify-content:space-between;gap:4px;font-size:10px;padding:4px 6px 5px;color:#56625e;font-weight:700;font-variant-numeric:tabular-nums}
.acard.sil .pic svg{filter:brightness(0);opacity:.28}
.acard.sil .hd{background:#7c857f}
.acard.none{background:rgba(0,0,0,.18);box-shadow:inset 0 0 0 2px rgba(234,242,238,.12);color:var(--ink-dim)}
.acard.none .q{height:110px;display:grid;place-items:center;font-family:var(--display);font-size:28px;color:rgba(234,242,238,.25)}
.acard.none .meta2{color:var(--ink-dim)}
.rar{font-size:9px;text-transform:uppercase;letter-spacing:.6px}
.rar.r2{color:#b07a00}

/* status */
.status{position:absolute;right:5px;top:28px;display:grid;gap:2px;justify-items:end;z-index:2}
.sm .status{top:24px}
.status span{font-size:8.5px;text-transform:uppercase;letter-spacing:.5px;padding:1px 5px;border-radius:6px;color:#fff;font-weight:800}
.st-psn{background:#9a3fb4}.st-stn{background:#d18a00}
.typegrid{display:flex;flex-wrap:wrap;gap:6px}
.typegrid button{background:rgba(0,0,0,.2);color:var(--ink);display:inline-flex;align-items:center;gap:6px;padding:8px 10px}
.typegrid button .dot{width:12px;height:12px;border-radius:50%}
.typegrid button.on{box-shadow:inset 0 0 0 3px var(--gold);background:rgba(242,193,78,.12)}
.typegrid button[disabled]{opacity:.35}
.wk{display:flex;flex-wrap:wrap;gap:6px;font-size:12px;color:var(--ink-dim)}
.wk span{background:rgba(0,0,0,.2);padding:3px 8px;border-radius:8px}
</style>

<div id="app"></div>

<script>
const HEADLESS = typeof document === 'undefined';
const TYPES = {
  F:{n:'Fogo',c:'#e0582c',b:'#fbe3d6',l:'F'}, A:{n:'Água',c:'#2f7fd1',b:'#dbeaf9',l:'A'},
  P:{n:'Planta',c:'#3d9a47',b:'#def0d9',l:'P'}, E:{n:'Elétrico',c:'#d9a514',b:'#fbf1cf',l:'E'},
  R:{n:'Pedra',c:'#8a6a4c',b:'#ece2d6',l:'R'}, N:{n:'Normal',c:'#857f96',b:'#e8e6ee',l:'N'},
  G:{n:'Gelo',c:'#3fa9c4',b:'#daf2f7',l:'G'}, S:{n:'Sombra',c:'#4a4e7c',b:'#e1e2ef',l:'S'},
  L:{n:'Lutador',c:'#b8323f',b:'#f6dcdf',l:'L'}, V:{n:'Voador',c:'#6f93b8',b:'#e2ebf4',l:'V'},
  T:{n:'Tóxico',c:'#9a3fb4',b:'#efdff5',l:'T'}, Y:{n:'Psíquico',c:'#d94f92',b:'#f9dfec',l:'Ψ'}
};
const WEAK = {F:'A', A:'E', P:'F', E:'R', R:'P', N:'L', G:'F', S:'S', L:'Y', V:'G', T:'Y', Y:'S'};
const FX = {
  heal20:'Cure 20 de dano desta criatura.', heal30:'Cure 30 de dano desta criatura.', heal40:'Cure 40 de dano desta criatura.',
  draw1:'Compre 1 carta.', bench10:'Causa 10 de dano a cada criatura do banco do oponente.',
  stun:'Jogue uma moeda. Se der cara, o oponente fica atordoado e não ataca no próximo turno.',
  poison:'O oponente fica envenenado: leva 10 de dano ao fim de cada turno até sair da frente ou evoluir.'
};
const DEX = {};
function mk(id,name,type,stage,from,hp,ret,atks){
  DEX[id]={name,type,stage,from,hp,ret,atk:atks.map(([n,c,dmg,fx])=>({n,cost:[...c].map(ch=>ch==='*'?'*':ch),dmg,fx,txt:fx?FX[fx]:''}))};
}
// Fogo
mk('brasito','Brasito','F',0,null,50,1,[['Brasa','F',20]]);
mk('fornalho','Fornalho','F',1,'brasito',90,2,[['Chamuscar','F',20],['Labareda','FF*',60]]);
mk('vulcarion','Vulcarion','F',2,'fornalho',140,3,[['Fagulha','F*',40],['Erupção','FF**',120]]);
mk('fumaco','Fumaço','F',0,null,60,1,[['Tição','F*',30]]);
mk('fogareu','Fogaréu','F',1,'fumaco',100,2,[['Fornada','F*',40],['Incêndio','FF*',60,'bench10']]);
// Água
mk('gotito','Gotito','A',0,null,50,1,[['Borrifo','A',20]]);
mk('marejo','Marejo','A',1,'gotito',90,1,[['Jato d’água','A*',30],['Maré alta','AA*',60]]);
mk('abyssor','Abyssor','A',2,'marejo',140,3,[['Redemoinho','A*',40],['Abismo','AA**',110,'draw1']]);
mk('conchito','Conchito','A',0,null,60,2,[['Bolhas','A',10,'stun'],['Pinça','A*',30]]);
mk('carapaco','Carapaço','A',1,'conchito',110,3,[['Casco firme','A*',30,'heal20'],['Pressão','AA*',70]]);
// Planta
mk('brotim','Brotim','P',0,null,60,1,[['Chicote de folha','P',20]]);
mk('ramagem','Ramagem','P',1,'brotim',90,2,[['Semente sugadora','P*',30,'heal20'],['Galhada','PP*',60]]);
mk('selvagor','Selvagor','P',2,'ramagem',150,3,[['Esporos','P*',40],['Fúria da mata','PP**',100,'heal30']]);
mk('cogumim','Cogumim','P',0,null,50,1,[['Pó calmante','P',10,'heal20']]);
mk('fungaldo','Fungaldo','P',1,'cogumim',90,2,[['Raiz funda','P*',30,'heal20'],['Pancada','PP*',60]]);
// Elétrico
mk('faiscar','Faiscar','E',0,null,50,0,[['Choque','E',20]]);
mk('voltrok','Voltrok','E',1,'faiscar',80,1,[['Descarga','E*',40]]);
mk('trovaldo','Trovaldo','E',2,'voltrok',130,1,[['Raio','E*',50],['Tempestade','EE**',90,'bench10']]);
mk('pilhoca','Pilhoca','E',0,null,60,1,[['Estalo','E',10,'stun'],['Curto','E*',40]]);
// Pedra
mk('seixo','Seixo','R',0,null,70,2,[['Pedrada','R*',20]]);
mk('penhasco','Penhasco','R',1,'seixo',100,3,[['Rolamento','R*',40],['Desmoronar','RR*',70]]);
mk('montarok','Montarok','R',2,'penhasco',170,4,[['Tremor','RR',50,'bench10'],['Avalanche','RRR*',130]]);
mk('cascalho','Cascalho','R',0,null,60,1,[['Areia','R',10],['Rolada','R*',30]]);
mk('rochedo','Rochedo','R',1,'cascalho',110,3,[['Esmagar','RR*',70]]);
// Normal
mk('pipo','Pipo','N',0,null,50,1,[['Bicada','*',10],['Investida','**',30]]);
mk('pipao','Pipão','N',1,'pipo',90,1,[['Revoada','*',20,'draw1'],['Rasante','***',60]]);
mk('fofuco','Fofuco','N',0,null,70,1,[['Canção de ninar','**',10,'stun'],['Pulo fofo','***',40]]);
mk('ronquito','Ronquito','N',0,null,70,2,[['Bocejo','*',10,'heal20'],['Barrigada','***',50]]);
mk('roncao','Roncão','N',1,'ronquito',130,4,[['Soneca','**',0,'heal40'],['Barrigão','****',90]]);

/* ---------- utilidades ---------- */
let UID = 1;
const shuffle = a => { for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const hash = s => { let h=2166136261; for(const ch of s){ h^=ch.charCodeAt(0); h=Math.imul(h,16777619)>>>0; } return h; };
const wait = ms => new Promise(r=>setTimeout(r, SIM?0:ms));
const pickRnd = a => a[Math.floor(Math.random()*a.length)];
function chains(type){
  return ALL.filter(k=>DEX[k].type===type && DEX[k].stage===0).map(b=>{
    const c=[b]; let cur=b;
    for(;;){ const nx=ALL.find(k=>DEX[k].from===cur); if(!nx) break; c.push(nx); cur=nx; }
    return c;
  });
}
function buildDeck(types){
  const d=[]; const add=(kind,id,type)=>d.push({uid:UID++,kind,id,type});
  const lines=types.flatMap(chains);
  const counts=new Map(); let total=0; const LIMIT=14;
  const plan=[[0,2],[1,1],[2,1],[0,1],[1,1],[0,1],[2,1],[1,1],[0,1]];
  outer: for(const [st,n] of plan) for(const L of lines){ if(!L[st]) continue; for(let i=0;i<n;i++){ if(total>=LIMIT) break outer; counts.set(L[st],(counts.get(L[st])||0)+1); total++; } }
  while(total<LIMIT) for(const L of lines){ if(total>=LIMIT) break; counts.set(L[0],counts.get(L[0])+1); total++; }
  counts.forEach((n,id)=>{ for(let i=0;i<n;i++) add('mon',id,DEX[id].type); });
  const eT=types.filter(t=>t!=='N'); const main=eT[0], sec=eT[1];
  for(let i=0;i<(sec?8:12);i++) add('energy','E'+main,main);
  if(sec) for(let i=0;i<4;i++) add('energy','E'+sec,sec);
  add('item','pocao'); add('item','pocao'); add('item','troca'); add('item','troca');
  return shuffle(d);
}
const isBasic = c => c.kind==='mon' && DEX[c.id].stage===0;
const isEvo = c => c.kind==='mon' && DEX[c.id].stage>0;

let save={progress:0, owned:{}, seen:[]};
try{ const raw=localStorage.getItem('duelo-bolso-v2'); if(raw) save=Object.assign(save, JSON.parse(raw)); }catch(e){}
function persist(){ if(SIM) return; try{ localStorage.setItem('duelo-bolso-v2', JSON.stringify(save)); }catch(e){} }
function markSeen(id){ if(!save.seen.includes(id)) save.seen.push(id); }
const owns = id => (save.owned[id]||0)>0;
function unlockedTypes(){
  const s=new Set([...STARTERS,'N']);
  ALL.forEach(id=>{ if(owns(id)) s.add(DEX[id].type); });
  return Object.keys(TYPES).filter(t=>s.has(t));
}
function rollDrops(win, rivalTypes){
  const out=[];
  for(let i=0;i<(win?3:1);i++){
    const r=Math.random();
    let st = !win ? 0 : r<.6 ? 0 : r<.88 ? 1 : 2;
    const pool = Math.random()<.5 ? rivalTypes : Object.keys(TYPES);
    let cand = ALL.filter(id=>pool.includes(DEX[id].type) && DEX[id].stage===st);
    if(!cand.length) cand = ALL.filter(id=>DEX[id].stage===st);
    const id=pickRnd(cand);
    out.push({id, isNew:!owns(id) && !out.some(o=>o.id===id)});
    save.owned[id]=(save.owned[id]||0)+1; markSeen(id);
  }
  return out;
}

/* ---------- arte original das criaturas ---------- */
function shade(hex,amt){
  const n=parseInt(hex.slice(1),16); let r=n>>16,g=(n>>8)&255,b=n&255;
  const t=amt<0?0:255, p=Math.abs(amt);
  r=Math.round(r+(t-r)*p); g=Math.round(g+(t-g)*p); b=Math.round(b+(t-b)*p);
  return '#'+((1<<24)|(r<<16)|(g<<8)|b).toString(16).slice(1);
}
function art(id){
  const d=DEX[id], T=TYPES[d.type], s=d.stage, h=hash(id);

  if(tail===2) back+=`<path d="M${cx+rx-6} ${cy+ry*.1} L${cx+rx+14+s*3} ${cy-4} L${cx+rx-4} ${cy+ry*.5} Z" fill="${deep}"/>`;
  // orelhas
  if(ears===1) back+=`<path d="M${cx-rx*.75} ${top+ry*.5} L${cx-rx*.62} ${top-12-s*2} L${cx-rx*.2} ${top+ry*.2} Z M${cx+rx*.75} ${top+ry*.5} L${cx+rx*.62} ${top-12-s*2} L${cx+rx*.2} ${top+ry*.2} Z" fill="${base}"/>`;
  if(ears===2) back+=`<circle cx="${cx-rx*.68}" cy="${top+5}" r="${6+s}" fill="${base}"/><circle cx="${cx+rx*.68}" cy="${top+5}" r="${6+s}" fill="${base}"/><circle cx="${cx-rx*.68}" cy="${top+5}" r="${3+s*.5}" fill="${light}"/><circle cx="${cx+rx*.68}" cy="${top+5}" r="${3+s*.5}" fill="${light}"/>`;
  if(ears===3) back+=`<path d="M${cx-6} ${top+4} Q${cx-10} ${top-8} ${cx-16} ${top-12} M${cx+6} ${top+4} Q${cx+10} ${top-8} ${cx+16} ${top-12}" stroke="${deep}" stroke-width="2" fill="none"/><circle cx="${cx-16}" cy="${top-12}" r="3.5" fill="${light}"/><circle cx="${cx+16}" cy="${top-12}" r="3.5" fill="${light}"/>`;
  // crista do elemento
  const t=d.type;
  if(t==='F') back+=`<path d="M${cx-10} ${top+8} Q${cx-4} ${top-16-s*6} ${cx+2} ${top-2} Q${cx+6} ${top-22-s*6} ${cx+11} ${top+8} Z" fill="#ffb03a"/><path d="M${cx-4} ${top+8} Q${cx+1} ${top-6-s*3} ${cx+5} ${top+8} Z" fill="#ffe08a"/>`;
  if(t==='A') back+=`<path d="M${cx-12} ${top+10} Q${cx} ${top-18-s*5} ${cx+12} ${top+10} Z" fill="#8cc7ff"/>`+(s>0?`<path d="M${cx-rx+2} ${cy} q-12 -6 -10 -18 q6 8 12 10z M${cx+rx-2} ${cy} q12 -6 10 -18 q-6 8 -12 10z" fill="#8cc7ff"/>`:'');
  if(t==='P') back+=`<path d="M${cx} ${top+6} L${cx} ${top-8-s*4}" stroke="#2b6e2f" stroke-width="3"/><ellipse cx="${cx-9}" cy="${top-8-s*4}" rx="${9+s*2}" ry="5" fill="#7cc86a" transform="rotate(-25 ${cx-9} ${top-8-s*4})"/><ellipse cx="${cx+9}" cy="${top-10-s*4}" rx="${9+s*2}" ry="5" fill="#5fae52" transform="rotate(25 ${cx+9} ${top-10-s*4})"/>`;
  if(t==='E') back+=`<path d="M${cx-rx+6} ${top+10} l-6 -${16+s*4} l8 6 l-2 -${10+s*3} l10 ${18+s*4} l-7 -4z M${cx+rx-6} ${top+10} l6 -${16+s*4} l-8 6 l2 -${10+s*3} l-10 ${18+s*4} l7 -4z" fill="#ffe14d" stroke="#8a6a00" stroke-width="1.2"/>`;

  if(t==='L') front+=`<rect x="${cx-rx*.92}" y="${top+ry*.28}" width="${rx*1.84}" height="5" rx="2" fill="#f2f2f2"/><path d="M${cx+rx*.8} ${top+ry*.36} l10 6 l-9 3z" fill="#f2f2f2"/><circle cx="${cx-rx-3}" cy="${cy+ry*.25}" r="${6+s*1.5}" fill="${light}" stroke="${deep}" stroke-width="1.2"/><circle cx="${cx+rx+3}" cy="${cy+ry*.25}" r="${6+s*1.5}" fill="${light}" stroke="${deep}" stroke-width="1.2"/>`;
  if(t==='V') back+=`<ellipse cx="${cx-rx-6}" cy="${cy-4}" rx="${12+s*3}" ry="6" fill="${light}" transform="rotate(-28 ${cx-rx-6} ${cy-4})"/><ellipse cx="${cx+rx+6}" cy="${cy-4}" rx="${12+s*3}" ry="6" fill="${light}" transform="rotate(28 ${cx+rx+6} ${cy-4})"/><path d="M${cx-4} ${top+2} q4 -12 8 0" fill="${deep}"/>`;
  if(t==='T') back+=[-10,0,10].map((dx,i)=>`<circle cx="${cx+dx}" cy="${top-2-(i===1?6:0)-s*2}" r="${4+s}" fill="#c98ae0" stroke="#6d2a84" stroke-width="1"/>`).join('');
  if(t==='Y') front+=`<path d="M${cx} ${top+ry*.12} l5 6 l-5 6 l-5 -6z" fill="#ffd1ea" stroke="#a32b66" stroke-width="1"/>`, back+=`<path d="M${cx-8} ${top+4} L${cx-14} ${top-12}" stroke="${deep}" stroke-width="2"/><path d="M${cx+8} ${top+4} L${cx+14} ${top-12}" stroke="${deep}" stroke-width="2"/><circle cx="${cx-14}" cy="${top-13}" r="4" fill="#ffb3d6"/><circle cx="${cx+14}" cy="${top-13}" r="4" fill="#ffb3d6"/>`;
  // padrão no corpo

  if(pat===1) patt=`<circle cx="${cx+rx*.5}" cy="${cy-ry*.1}" r="3" fill="${deep}" opacity=".45"/><circle cx="${cx+rx*.62}" cy="${cy+ry*.25}" r="2.2" fill="${deep}" opacity=".45"/><circle cx="${cx-rx*.6}" cy="${cy+ry*.15}" r="2.6" fill="${deep}" opacity=".45"/>`;
  if(pat===2) patt=`<path d="M${cx-rx*.8} ${cy-ry*.45} q${rx*.8} -${ry*.25} ${rx*1.6} 0" stroke="${deep}" stroke-width="3" fill="none" opacity=".45"/>`;
  // olhos
  const ex=7+(h%3)+s*1.5, ey=cy-3-(h%2)*2, er=4+s*.6;
  let eye=`<circle cx="${cx-ex}" cy="${ey}" r="${er}" fill="#fff"/><circle cx="${cx+ex}" cy="${ey}" r="${er}" fill="#fff"/>
    <circle cx="${cx-ex+1}" cy="${ey+.5}" r="${er*.55}" fill="#1c1414"/><circle cx="${cx+ex+1}" cy="${ey+.5}" r="${er*.55}" fill="#1c1414"/>`;
  if(eyes===1) eye+=`<path d="M${cx-ex-er-.5} ${ey} a${er+.5} ${er+.5} 0 0 1 ${2*er+1} 0z M${cx+ex-er-.5} ${ey} a${er+.5} ${er+.5} 0 0 1 ${2*er+1} 0z" fill="${base}"/>`;
  if(eyes===2) eye+=`<circle cx="${cx-ex+2}" cy="${ey-1}" r="${er*.2}" fill="#fff"/><circle cx="${cx+ex+2}" cy="${ey-1}" r="${er*.2}" fill="#fff"/>`;
  const mouth = h%2 ? `<path d="M${cx-5} ${cy+7} Q${cx} ${cy+12} ${cx+5} ${cy+7}" stroke="#2a1d1d" stroke-width="2" fill="none" stroke-linecap="round"/>`
                    : `<path d="M${cx-4} ${cy+7} L${cx} ${cy+10} L${cx+4} ${cy+7}" stroke="#2a1d1d" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`;

/* ---------- estado do duelo ---------- */
let game=null;
let ui={sel:null, mode:null};
let menu={tab:'duelo', main:'F', sup:'N', rival:0};

function newPlayer(name,types){
  return {name,types,deck:buildDeck(types),hand:[],discard:[],active:null,bench:[],points:0,turns:0,energyPlayed:false,retreated:false};
}
function draw(P,n=1){ for(let i=0;i<n;i++){ if(!P.deck.length) return false; P.hand.push(P.deck.pop()); } return true; }
function setupHand(P){
  let tries=0;
  do{ P.deck.push(...P.hand); P.hand=[]; shuffle(P.deck); draw(P,7); tries++; } while(!P.hand.some(isBasic) && tries<50);
  const basics=P.hand.filter(isBasic).sort((a,b)=>DEX[b.id].hp-DEX[a.id].hp);
  placeMon(P, basics[0], 0);
}
function mkMon(card,turn){ return {card,stack:[card],dmg:0,en:[],played:turn,evolved:-1,hitAt:0,atkAt:0,poison:false,stunTurn:-1}; }
function placeMon(P,card,turn){
  P.hand.splice(P.hand.indexOf(card),1);
  const m=mkMon(card,turn);
  if(!P.active) P.active=m; else P.bench.push(m);
  markSeen(card.id);
}
function newGame(types, rivalIdx){
  const R=RIVALS[rivalIdx];
  game={turn:0,cur:0,over:null,rival:rivalIdx,log:[],busy:false,waitPromote:false,afterPromote:0,
    p:[newPlayer('Você',types), newPlayer(R.name,R.types)]};
  ui={sel:null,mode:null};
  setupHand(game.p[0]); setupHand(game.p[1]);
  log('O duelo começou! Você joga primeiro.');
  startTurn(0);
}
function log(msg){ if(!game) return; game.log.unshift(msg); if(game.log.length>40) game.log.pop(); }
const ref2mon = (s,ref) => ref.zone==='active' ? game.p[s].active : game.p[s].bench[ref.i];
const D = m => DEX[m.card.id];
const hpLeft = m => D(m).hp - m.dmg;
const clearStatus = m => { if(m){ m.poison=false; m.stunTurn=-1; } };

/* ---------- regras ---------- */
function canPay(en,cost){
  const pool={}; en.forEach(t=>pool[t]=(pool[t]||0)+1);
  let any=0;
  for(const c of cost){ if(c==='*'){any++;continue;} if(!pool[c]) return false; pool[c]--; }
  return Object.values(pool).reduce((a,b)=>a+b,0) >= any;
}
function canEvolveOnto(s,card,m){
  const P=game.p[s];
  return !!m && DEX[card.id].from===m.card.id && m.played<game.turn && m.evolved<game.turn && P.turns>1;
}
function evoBlockReason(s,card){
  const P=game.p[s]; const d=DEX[card.id];
  if(P.turns<=1) return 'Ninguém pode evoluir no primeiro turno.';
  const mons=[P.active,...P.bench].filter(Boolean);
  const same=mons.filter(m=>m.card.id===d.from);
  if(!same.length) return `Precisa ter ${DEX[d.from].name} na mesa para evoluir.`;
  if(same.every(m=>m.played>=game.turn)) return `${DEX[d.from].name} entrou na mesa neste turno. Espere o próximo.`;
  if(same.every(m=>m.evolved>=game.turn)) return 'Essa criatura já evoluiu neste turno.';
  return '';
}
function playBasic(s,card){
  const P=game.p[s];
  if(!isBasic(card) || (P.active && P.bench.length>=3)) return false;
  placeMon(P,card,game.turn);
  log(`${P.name} colocou ${DEX[card.id].name} ${P.active.card===card?'como ativa':'no banco'}.`);
  return true;
}
function evolve(s,card,ref){
  const P=game.p[s], m=ref2mon(s,ref);
  if(!canEvolveOnto(s,card,m)) return false;
  P.hand.splice(P.hand.indexOf(card),1);
  const old=D(m).name;
  m.stack.push(card); m.card=card; m.evolved=game.turn; clearStatus(m); markSeen(card.id);
  log(`${P.name} evoluiu ${old} para ${DEX[card.id].name}!`);
  return true;
}
function attachEnergy(s,card,ref){
  const P=game.p[s], m=ref2mon(s,ref);
  if(P.energyPlayed || card.kind!=='energy' || !m) return false;
  P.hand.splice(P.hand.indexOf(card),1);
  m.en.push(card.type); P.discard.push(card); P.energyPlayed=true;
  log(`${P.name} ligou energia de ${TYPES[card.type].n} em ${D(m).name}.`);
  return true;
}
function usePotion(s,card,ref){
  const P=game.p[s], m=ref2mon(s,ref);
  if(!m || (m.dmg<=0 && !m.poison)) return false;
  P.hand.splice(P.hand.indexOf(card),1); P.discard.push(card);
  const h=Math.min(30,m.dmg); m.dmg-=h; m.poison=false;
  log(`${P.name} usou Poção em ${D(m).name} (+${h}).`);
  return true;
}
function swapActive(s,i){ const P=game.p[s]; const a=P.active; clearStatus(a); P.active=P.bench[i]; P.bench[i]=a; }
function useSwitch(s,card,i){
  const P=game.p[s]; if(!P.bench[i]) return false;
  P.hand.splice(P.hand.indexOf(card),1); P.discard.push(card);
  swapActive(s,i); log(`${P.name} usou Troca: ${D(P.active).name} agora é a ativa.`);
  return true;
}
function canRetreat(s){ const P=game.p[s]; return P.active && !P.retreated && P.bench.length>0 && P.active.en.length>=D(P.active).ret; }
function retreat(s,i){
  const P=game.p[s]; if(!canRetreat(s) || !P.bench[i]) return false;
  const c=D(P.active).ret; P.active.en.splice(0,c);
  const old=D(P.active).name; swapActive(s,i); P.retreated=true;
  log(`${P.name} recuou ${old}${c?` (descartou ${c} energia${c>1?'s':''})`:''}.`);
  return true;
}
const isStunned = m => m && m.stunTurn===game.turn;
function canAttack(s,k){
  const P=game.p[s]; if(!P.active || game.turn===1 || isStunned(P.active)) return false;
  return canPay(P.active.en, D(P.active).atk[k].cost);
}
function effDmg(att,def,a){ return a.dmg * (WEAK[D(def).type]===D(att).type ? 2 : 1); }
function knockOut(s,ref){
  const P=game.p[s], O=game.p[1-s], m=ref2mon(s,ref);
  P.discard.push(...m.stack);
  if(ref.zone==='active') P.active=null; else P.bench.splice(ref.i,1);
  O.points++;
  log(`${D(m).name} de ${P.name} foi nocauteado! ${O.name} marca ponto (${O.points}/${WIN_PTS}).`);
}
function attack(s,k){
  if(!canAttack(s,k)) return false;
  const P=game.p[s], O=game.p[1-s], me=P.active, a=D(me).atk[k], def=O.active;
  me.atkAt=Date.now();
  if(a.dmg>0){
    const dmg=effDmg(me,def,a), weak=dmg>a.dmg;
    def.dmg+=dmg; def.hitAt=Date.now()+250;
    log(`${D(me).name} usou ${a.n}: ${dmg} de dano em ${D(def).name}${weak?' (fraqueza x2!)':''}.`);
  } else log(`${D(me).name} usou ${a.n}.`);
  if(a.fx && a.fx.startsWith('heal')){ const h=Math.min(me.dmg, +a.fx.slice(4)); me.dmg-=h; if(h) log(`${D(me).name} curou ${h}.`); }
  if(a.fx==='draw1') draw(P,1);
  if(a.fx==='bench10'){ O.bench.forEach(b=>{b.dmg+=10;b.hitAt=Date.now()+250;}); if(O.bench.length) log('Cada criatura do banco rival levou 10.'); }
  if(a.fx==='poison' && hpLeft(def)>0){ def.poison=true; log(`${D(def).name} foi envenenado.`); }
  if(a.fx==='stun' && hpLeft(def)>0){ if(Math.random()<.5){ def.stunTurn=game.turn+1; log(`Cara! ${D(def).name} ficou atordoado.`); } else log('Coroa: o atordoamento falhou.'); }
  for(let i=O.bench.length-1;i>=0;i--) if(hpLeft(O.bench[i])<=0) knockOut(1-s,{zone:'bench',i});
  if(hpLeft(def)<=0) knockOut(1-s,{zone:'active'});
  checkWin();
  if(!game.over) endTurn(s);
  return true;
}
function checkWin(){
  if(game.over) return;
  for(const s of [0,1]){ if(game.p[s].points>=WIN_PTS) return finish(s, s===0?`Você fez ${WIN_PTS} pontos de nocaute.`:`${game.p[s].name} fez ${WIN_PTS} pontos de nocaute.`); }
  for(const s of [0,1]){ const P=game.p[s]; if(!P.active && !P.bench.length) return finish(1-s, s===0?'Você ficou sem criaturas na mesa.':`${P.name} ficou sem criaturas na mesa.`); }
}
function finish(w,why){
  game.over={winner:w,why,drops:[]}; ui={sel:null,mode:null};
  log(w===0?'Vitória!':'Derrota.');
  if(!SIM){
    if(w===0 && game.rival+1>save.progress) save.progress=game.rival+1;
    game.over.drops=rollDrops(w===0, RIVALS[game.rival].types);
    persist();
  }
  render();
}
function autoPromote(s){
  const P=game.p[s]; if(P.active || !P.bench.length) return;
  let best=0; P.bench.forEach((m,i)=>{ if(hpLeft(m)+m.en.length*20 > hpLeft(P.bench[best])+P.bench[best].en.length*20) best=i; });
  P.active=P.bench.splice(best,1)[0];
  log(`${P.name} mandou ${D(P.active).name} para a frente.`);
}
function endTurn(s){
  if(game.over) return;
  ui={sel:null,mode:null};
  // veneno entre turnos
  for(const k of [s,1-s]){
    const m=game.p[k].active;
    if(m && m.poison){ m.dmg+=10; m.hitAt=Date.now(); log(`${D(m).name} levou 10 do veneno.`); if(hpLeft(m)<=0) knockOut(k,{zone:'active'}); }
  }
  checkWin(); if(game.over) return;
  const n=1-s;
  autoPromote(1); if(SIM) autoPromote(0);
  if(!game.p[0].active){ game.waitPromote=true; game.afterPromote=n; game.cur=0; ui.mode={type:'promote'}; render(); return; }
  startTurn(n);
}
function startTurn(s){
  if(game.over) return;
  game.turn++; game.cur=s;
  const P=game.p[s]; P.turns++; P.energyPlayed=false; P.retreated=false;
  if(!draw(P,1)){ finish(1-s, s===0?'Seu baralho acabou.':`O baralho de ${P.name} acabou.`); return; }
  if(s===1 || SIM){ render(); aiTurn(s); }
  else { log(isStunned(P.active)?`Seu turno. ${D(P.active).name} está atordoado e não pode atacar.`:'Seu turno.'); render(); }
}

/* ---------- IA ---------- */
async function aiTurn(s){
  game.busy=true;
  const P=game.p[s], O=game.p[1-s];
  const step=async()=>{ render(); await wait(650); };
  await wait(500);
  for(const c of [...P.hand]){ if(game.over) return; if(isBasic(c) && (!P.active || P.bench.length<3)){ playBasic(s,c); await step(); } }
  for(const c of [...P.hand].filter(isEvo).sort((a,b)=>DEX[b.id].stage-DEX[a.id].stage)){
    const refs=[{zone:'active'},...P.bench.map((_,i)=>({zone:'bench',i}))];
    const r=refs.find(r=>canEvolveOnto(s,c,ref2mon(s,r)));
    if(r){ evolve(s,c,r); await step(); }
  }
  const pot=P.hand.find(c=>c.id==='pocao');
  if(pot && P.active && (P.active.dmg>=30 || P.active.poison)){ usePotion(s,pot,{zone:'active'}); await step(); }
  if(O.active && P.active && (WEAK[D(P.active).type]===D(O.active).type || isStunned(P.active))){
    const i=P.bench.findIndex(m=>WEAK[D(m).type]!==D(O.active).type && m.en.length>0);
    const sw=P.hand.find(c=>c.id==='troca');
    if(i>=0 && sw){ useSwitch(s,sw,i); await step(); }
    else if(i>=0 && canRetreat(s) && D(P.active).ret<=1){ retreat(s,i); await step(); }
  }
  const ens=P.hand.filter(c=>c.kind==='energy');
  if(ens.length && !P.energyPlayed){
    const need=m=>Math.max(...D(m).atk.map(a=>a.cost.length)) - m.en.length;
    const cand=[P.active,...P.bench].filter(Boolean);
    const t=cand.find(m=>need(m)>0) || P.active;
    const en=ens.find(c=>c.type===D(t).type) || ens.find(c=>D(t).atk.some(a=>a.cost.includes(c.type))) || ens[0];
    const ref = t===P.active ? {zone:'active'} : {zone:'bench',i:P.bench.indexOf(t)};
    attachEnergy(s,en,ref); await step();
  }
  if(game.over) return;
  let best=-1, bestScore=-1;
  if(P.active && O.active) D(P.active).atk.forEach((a,k)=>{
    if(!canAttack(s,k)) return;
    const d=effDmg(P.active,O.active,a);
    const score=d + (d>=hpLeft(O.active)?1000:0) + (a.fx==='stun'||a.fx==='poison'?8:0) + (a.fx&&a.fx.startsWith('heal')&&P.active.dmg>0?15:0);
    if(score>bestScore){bestScore=score;best=k;}
  });
  game.busy=false;
  if(best>=0) attack(s,best);
  else { log(`${P.name} passou a vez.`); endTurn(s); }
  if(!SIM) render();
}

const $ = id => document.getElementById(id);
function pipsHTML(arr){ return `<span class="pips">${arr.map(t=>t==='*'?`<span class="pip any" title="Qualquer energia"></span>`:`<span class="pip" style="--tc:${TYPES[t].c}" title="${TYPES[t].n}">${TYPES[t].l}</span>`).join('')}</span>`; }
const stageLabel = d => d.stage===0?'Básico':`Estágio ${d.stage}`;
function costPips(cost,en){
  const res=cost.map(t=>({t,ok:en?false:null}));
  if(!en) return res;
  const pool={}; en.forEach(t=>pool[t]=(pool[t]||0)+1);
  res.forEach(r=>{ if(r.t!=='*' && pool[r.t]>0){ pool[r.t]--; r.ok=true; } });
  let left=Object.values(pool).reduce((a,b)=>a+b,0);
  res.forEach(r=>{ if(r.t==='*' && left>0){ left--; r.ok=true; } });
  return res;
}
function onePip(t,miss){
  return t==='*' ? `<span class="pip any ${miss?'miss':''}" title="Qualquer energia${miss?' (falta)':''}"></span>`
                 : `<span class="pip ${miss?'miss':''}" style="--tc:${TYPES[t].c}" title="${TYPES[t].n}${miss?' (falta)':''}">${TYPES[t].l}</span>`;
}
function costsHTML(id,en){

function cardPlayable(c){
  const P=game.p[0];

  if(isBasic(c)) return !P.active || P.bench.length<3;
  if(isEvo(c)) return !evoBlockReason(0,c);
  if(c.id==='pocao') return [P.active,...P.bench].some(m=>m&&(m.dmg>0||m.poison));
  if(c.id==='troca') return P.bench.length>0;

function isTarget(ref){

      ${o.winner===0&&game.rival<RIVALS.length-1&&save.progress===game.rival+1?`<p>Novo rival liberado: ${RIVALS[game.rival+1].name}.</p>`:''}
      ${o.winner===0&&game.rival===RIVALS.length-1?'<p>Você venceu a Campeã Aurora e completou a liga!</p>':''}
      ${o.drops.length?`<div class="label" style="margin:0">${o.winner===0?'Cartas ganhas':'Prêmio de consolação'}</div><div class="drops">${o.drops.map(x=>albumCard(x.id,{force:true,isNew:x.isNew})).join('')}</div>`:''}
      <div class="btns"><button data-a="btn:again">Revanche</button><button class="ghost" data-a="btn:menu">Menu</button></div></div></div>`:''}`;
  const h=document.querySelector('.hand'); if(h) h.scrollLeft=handScroll;
}
function menuHTML(){
  const un=unlockedTypes();
  if(!un.includes(menu.main) || menu.main==='N') menu.main='F';
  if(!un.includes(menu.sup) || menu.sup===menu.main) menu.sup='N';
  const ownedCount=ALL.filter(owns).length, seenCount=ALL.filter(id=>owns(id)||save.seen.includes(id)).length;
  const head=`<div><h1 class="logo">Duelo de Bolso</h1><p class="lede">Monte seu time, ligue energias e evolua na hora certa. Vença os oito rivais da liga e complete o álbum com as ${ALL.length} criaturas.</p></div>
    <div class="tabs"><button class="${menu.tab==='duelo'?'on':''}" data-a="tab:duelo">Duelo</button><button class="${menu.tab==='album'?'on':''}" data-a="tab:album">Álbum (${ownedCount}/${ALL.length})</button></div>`;
  if(menu.tab==='album'){
    return `<div class="menu">${head}
      <div class="stats"><span><b>${ownedCount}</b> obtidas</span><span><b>${seenCount}</b> vistas</span><span><b>${ALL.length-seenCount}</b> desconhecidas</span></div>
      <p class="lede" style="margin:0">Você ganha 3 cartas a cada vitória e 1 a cada derrota. Ter qualquer criatura de um elemento libera aquele elemento para montar seu baralho.</p>
      <div class="album">${ALL.map(id=>albumCard(id)).join('')}</div></div>`;
  }
  const typeBtn=(t,which)=>{
    const lock=!un.includes(t), on=menu[which]===t, dis=lock || (which==='sup'&&t===menu.main) || (which==='main'&&t==='N');
    return `<button class="${on?'on':''}" data-a="${which}:${t}" ${dis?'disabled':''} title="${lock?'Ganhe uma carta deste elemento para liberar':''}"><span class="dot" style="background:${TYPES[t].c}"></span>${TYPES[t].n}</button>`;
  };
  const lines=[menu.main,menu.sup].flatMap(chains);
  const rivals=RIVALS.map((r,i)=>`<button class="rival ${menu.rival===i?'on':''}" data-a="rival:${i}" ${i>save.progress?'disabled':''}>
      <span class="dot" style="background:${TYPES[r.types[0]].c}"></span><span class="dot" style="background:${TYPES[r.types[1]].c};margin-left:-8px"></span>${i+1}. ${r.name}<span class="st">${r.types.map(t=>TYPES[t].n).join(' + ')} · ${i<save.progress?'vencido':i===save.progress?'próximo desafio':'bloqueado'}</span></button>`).join('');
  return `<div class="menu">${head}
    <div><div class="label">Elemento principal</div><div class="typegrid">${Object.keys(TYPES).map(t=>typeBtn(t,'main')).join('')}</div></div>
    <div><div class="label">Elemento de apoio</div><div class="typegrid">${Object.keys(TYPES).map(t=>typeBtn(t,'sup')).join('')}</div></div>
    <div><div class="label">Criaturas no seu baralho</div><div class="pick">${lines.map(L=>`<div class="opt" style="cursor:default">${art(L[L.length-1])}<span class="nm">${DEX[L[L.length-1]].name}</span><small>${L.map(id=>DEX[id].name).join(' → ')}</small></div>`).join('')}</div></div>
    <div><div class="label">Escolha o rival</div><div class="rivals">${rivals}</div></div>
    <div class="btns"><button data-a="btn:start">Começar duelo</button></div>
    <details class="rules"><summary>Como jogar</summary><ul>
      <li><b>Básicos</b> entram direto na mesa: 1 ativa e até 3 no banco.</li>
      <li><b>Evoluções</b> só podem ser colocadas em cima da criatura certa que já está na mesa. Ela precisa estar lá desde antes deste turno, e só evolui uma vez por turno. Ninguém evolui no primeiro turno.</li>
      <li><b>Energia</b>: ligue 1 por turno em qualquer criatura sua. Cada carta mostra o custo dos ataques: pontinhos coloridos pedem energia daquele tipo, os cinzas aceitam qualquer uma. Na mesa, pontinho vazado é energia que ainda falta, e o ataque fica verde quando está pronto.</li>
      <li><b>Atacar</b> encerra o turno. Quem começa não ataca no turno 1.</li>
      <li><b>Veneno</b> tira 10 ao fim de cada turno. <b>Atordoado</b> não ataca no próximo turno. Os dois somem quando a criatura recua, é trocada ou evolui.</li>
      <li><b>Recuar</b> custa energias da criatura ativa, uma vez por turno.</li>
      <li>Vence quem fizer <b>${WIN_PTS} nocautes</b>, ou se o rival ficar sem criaturas na mesa ou sem cartas para comprar.</li>
    </ul>
    <div class="label" style="margin-top:12px">Fraquezas (leva dano dobrado de)</div>
    <div class="wk">${Object.keys(TYPES).map(t=>`<span>${TYPES[t].n} ← ${TYPES[WEAK[t]].n}</span>`).join('')}</div></details></div>`;
}
function onClick(e){
  const el=e.target.closest('[data-a]'); if(!el) return;
  const [kind,...rest]=el.dataset.a.split(':');
  if(!game){
    if(kind==='tab') menu.tab=rest[0];
    if(kind==='main'){ menu.main=rest[0]; if(menu.sup===menu.main) menu.sup='N'; }
    if(kind==='sup') menu.sup=rest[0];
    if(kind==='rival') menu.rival=+rest[0];
    if(el.dataset.a==='btn:start'){ newGame([menu.main,menu.sup],menu.rival); return; }
    render(); return;
  }
  const P=game.p[0], myTurn=game.cur===0 && !game.over && !game.busy;
  if(kind==='btn'){
    const b=rest[0];
    if(b==='menu'){ game=null; render(); return; }
    if(b==='again'){ newGame(game.p[0].types, game.rival); return; }
    if(b==='cancel'){ ui={sel:null,mode:null}; render(); return; }
    if(!myTurn) return;
    if(b==='end'){ if(game.waitPromote) return; log('Você passou a vez.'); endTurn(0); return; }
    if(b==='basic'){ const c=P.hand[+ui.sel.key.split(':')[1]]; if(c&&playBasic(0,c)) ui={sel:null,mode:null}; render(); return; }
    if(b==='atk'){ attack(0,+rest[1]); render(); return; }
    if(b==='retreat'){ if(canRetreat(0)) ui.mode={type:'retreat'}; render(); return; }
    return;
  }
  if(kind==='hand'){
    if(game.waitPromote) return;
    const i=+rest[0], c=P.hand[i];
    ui={sel:{key:'hand:'+i},mode:null};
    if(myTurn && c){
      if(c.kind==='energy' && !P.energyPlayed) ui.mode={type:'energy',card:c};
      else if(isEvo(c)) ui.mode={type:'evolve',card:c};
      else if(c.id==='pocao') ui.mode={type:'pocao',card:c};
      else if(c.id==='troca') ui.mode={type:'troca',card:c};
    }
    render(); return;
  }
  if(kind==='mon'){
    const s=+rest[0], z=rest[1], ref=z==='active'?{zone:'active'}:{zone:'bench',i:+z.slice(1)};
    if(s===0 && ui.mode && myTurn && isTarget(ref)){
      const m=ui.mode; let ok=false;
      if(m.type==='promote'){ P.active=P.bench.splice(ref.i,1)[0]; log(`Você mandou ${D(P.active).name} para a frente.`); game.waitPromote=false; ui={sel:null,mode:null}; startTurn(game.afterPromote); return; }
      if(m.type==='energy') ok=attachEnergy(0,m.card,ref);
      if(m.type==='evolve') ok=evolve(0,m.card,ref);
      if(m.type==='pocao') ok=usePotion(0,m.card,ref);
      if(m.type==='troca') ok=useSwitch(0,m.card,ref.i);
      if(m.type==='retreat') ok=retreat(0,ref.i);
      if(ok) ui={sel:null,mode:null};
      render(); return;
    }
    if(game.waitPromote) return;
    ui={sel:{key:el.dataset.a},mode:null}; render(); return;
  }
}
if(!HEADLESS){ document.addEventListener('click',onClick); render(); }

/* simulação de teste (somente fora do navegador) */
if(HEADLESS){ globalThis.__sim = async (n)=>{
  SIM=true; const res={0:0,1:0,turns:0};
  const ts=Object.keys(TYPES).filter(t=>t!=='N');
  for(let g=0;g<n;g++){
    newGame([ts[g%ts.length], pickRnd(Object.keys(TYPES).filter(t=>t!==ts[g%ts.length]))], g%RIVALS.length);
    for(let k=0;k<600 && !game.over;k++) await wait(0);
    if(!game.over) throw new Error('jogo travado no turno '+game.turn);
    res[game.over.winner]++; res.turns+=game.turn;
  }
  return res;
}; }
